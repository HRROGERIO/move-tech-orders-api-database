name: Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: container-registry.br-se1.magalu.cloud
  IMAGE_NAME: move-tech-orders-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install poetry
          poetry install --no-root

      - name: Executar testes
        run: poetry run pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login no Container Registry
        run: |
          docker login https://${{ env.REGISTRY }} \
            -u ${{ secrets.MGC_REGISTRY_USER }} \
            -p ${{ secrets.MGC_REGISTRY_PASSWORD }}

      - name: Build e Push da imagem
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ secrets.MGC_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.MGC_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config


      - name: Diagnóstico do kubeconfig
        run: |
          echo "=== Contexto ==="
          kubectl config current-context

          echo "=== Servidor ==="
          kubectl config view --minify

          echo "=== Cluster Info ==="
          kubectl cluster-info

          echo "=== Nodes ==="
          kubectl get nodes    

      - name: Create Kubernetes Secret
        run: |
          kubectl create secret generic db-secret \
            --from-literal=url='${{ secrets.DATABASE_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy no Kubernetes
        run: |
          export MGC_REGISTRY_NAME=${{ secrets.MGC_REGISTRY_NAME }}

          envsubst < k8s/app.yaml | kubectl apply -n move-tech-api -f -

          kubectl rollout status deployment/move-tech-orders-api -n move-tech-api
